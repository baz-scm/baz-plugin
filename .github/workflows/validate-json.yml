name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || exit 1
          done
      - name: Validate plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      - name: Check hook syntax
        run: for f in hooks/*.js; do node --check "$f"; done
      - name: Run hook tests
        # Behavioural, not syntactic: failSoft() turns a broken hook into a
        # silent exit 0, so `node --check` alone has already let a real
        # regression through.
        run: node tests/hooks.test.js
